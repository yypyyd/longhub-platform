# 龙枢公网入口：Portal、Admin 与 Cloud API 统一通过 TLS 暴露。
server {
  listen 80;
  listen [::]:80;
  server_name 154-9-26-158.sslip.io;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name 154-9-26-158.sslip.io;

  ssl_certificate /etc/letsencrypt/live/154-9-26-158.sslip.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/154-9-26-158.sslip.io/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 1024m;

  # 必须与 Cloud API 的 CLIENT_RELEASE_DIR=/var/lib/longhub/client-releases 一致。
  # 正则只暴露不可覆盖的版本化安装器；releases.json、临时文件和目录列表均不可访问。
  location ~ ^/downloads/(LongHub-Setup-[0-9]+\.[0-9]+\.[0-9]+\.exe)$ {
    alias /var/lib/longhub/client-releases/$1;
    limit_except GET HEAD { deny all; }
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    autoindex off;
  }

  location /downloads/ {
    return 404;
  }

  location /v1/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location = /admin {
    return 302 /admin/;
  }
  location /admin/ {
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
