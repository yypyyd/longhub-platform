packages:
  - apps/*
  - packages/*
  # Clean-launch workspace: the old Electron/Pack publishing surface and
  # packages that only served it stay on disk for audit, but are not active
  # workspace projects or default build/test inputs.
  - '!apps/longhub-desktop'
  - '!apps/longhub-console'
  - '!packages/longhub-api-client'
  - '!packages/longhub-core'
  - '!packages/longhub-hr-suite'
  - '!packages/longhub-openclaw-bridge'
  - '!packages/longhub-openclaw-compat'
  - '!packages/longhub-sdk'
  - '!packages/longhub-xiaolongxia-adapter'

allowBuilds:
  '@google/genai': false
  esbuild: true
  openclaw: true
  protobufjs: false
  tree-sitter-bash: false

# 固定仍处于供应链观察期的传递依赖到已验证的前一补丁版本。
overrides:
  app-builder-lib@25.1.8>minimatch: 10.2.5
  browserslist@4.28.7>electron-to-chromium: 1.5.396
  glob@13.0.6>minimatch: 10.2.5
