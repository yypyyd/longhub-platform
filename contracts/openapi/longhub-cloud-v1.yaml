    # The publish request may omit integrity; Cloud recomputes and signs it.
    # Keep the core fields in a separate schema so the signed response can make
    # integrity mandatory without forcing publishers to supply ignored values.
    CloudSkillAdapterManifest:
      type: object
      allOf:
        - $ref: "#/components/schemas/CloudSkillAdapterManifestFields"
        - type: object
          required: [integrity]
    CloudSkillAdapterPublishManifest:
      allOf:
        - $ref: "#/components/schemas/CloudSkillAdapterManifestFields"
      description: integrity 可省略；若提供也不构成信任输入，Cloud 会根据固定文件重新计算摘要并签名。
    CloudSkillAdapterManifestFields:
      type: object
      additionalProperties: false
      required: [schema_version, skill_id, version, display, service, schemas, files, subscription, permissions, compatibility]
      properties:
        schema_version: { type: string, const: longhub/cloud-skill-adapter/v1 }
        skill_id: { type: string, pattern: '^[a-z][a-z0-9-]*(?:\.[a-z][a-z0-9-])*\.skill\.[a-z][a-z0-9-]*(?:\.[a-z][a-z0-9-])*$' }
        version: { type: string, pattern: '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$' }
        display:
          type: object
          additionalProperties: false
          required: [name, description, category]
          properties:
            name: { type: string, minLength: 1, maxLength: 80 }
            description: { type: string, minLength: 1, maxLength: 500 }
            category: { type: string, minLength: 1, maxLength: 40 }
        service:
          type: object
          additionalProperties: false
          required: [service_id, api_version, entry]
          properties:
            service_id: { type: string, pattern: '^[a-z][a-z0-9-]*(?:\.[a-z][a-z0-9-]*)+$' }
            api_version: { type: string, pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)$' }
            entry: { type: string, const: local-longhub-bridge }
        schemas:
          type: object
          additionalProperties: false
          required: [input, output]
          properties:
            input: { type: string, const: schemas/input.json }
            output: { type: string, const: schemas/output.json }
        # The manifest declares ordered file metadata; the download envelope
        # carries the separate Base64 file map.
        files:
          type: array
          minItems: 3
          maxItems: 3
          prefixItems:
            - allOf:
                - $ref: "#/components/schemas/CloudSkillAdapterFile"
                - type: object
                  properties: { path: { const: SKILL.md } }
            - allOf:
                - $ref: "#/components/schemas/CloudSkillAdapterFile"
                - type: object
                  properties: { path: { const: schemas/input.json } }
            - allOf:
                - $ref: "#/components/schemas/CloudSkillAdapterFile"
                - type: object
                  properties: { path: { const: schemas/output.json } }
          items: false
        subscription:
          type: object
          additionalProperties: false
          required: [plan_ids]
          properties:
            plan_ids: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string } }
        permissions:
          type: object
          additionalProperties: false
          required: [requested, confirmation_class]
          properties:
            requested: { type: array, maxItems: 64, uniqueItems: true, items: { type: string } }
            confirmation_class: { type: string, enum: [none, per_execution] }
        compatibility:
          type: object
          additionalProperties: false
          required: [manager_min_version, openclaw_version]
          properties:
            manager_min_version: { type: string }
            openclaw_version: { type: string }
        integrity:
          type: object
          additionalProperties: false
          required: [algorithm, digest, signature_key_id, signature]
          properties:
            algorithm: { type: string, const: sha256 }
            digest: { type: string, pattern: '^[a-f0-9]{64}$' }
            signature_key_id: { type: string }
            signature: { type: string, pattern: '^[A-Za-z0-9+/]{86}==$' }
    CloudSkillAdapterFile:
      type: object
      additionalProperties: false
      required: [path, sha256, size]
      properties:
        path: { type: string, enum: [SKILL.md, schemas/input.json, schemas/output.json] }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size: { type: integer, minimum: 1, maximum: 4194304 }
    CloudSkillAdapterFiles:
      type: object
      additionalProperties: false
      required: [SKILL.md, schemas/input.json, schemas/output.json]
      properties:
        SKILL.md: { type: string, contentEncoding: base64, maxLength: 5592408 }
        schemas/input.json: { type: string, contentEncoding: base64, maxLength: 5592408 }
        schemas/output.json: { type: string, contentEncoding: base64, maxLength: 5592408 }
    CloudSkillAdapterDownload:
      type: object
      additionalProperties: false
      required: [adapter, digest, signature_key_id]
      properties:
        adapter:
