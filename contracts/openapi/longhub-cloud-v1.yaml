    CloudSkillCallV1:
      type: object
      additionalProperties: false
      required: [schema_version, request_id, kind, skill_id, skill_version, agent_id, tool_call_id, session_key_hash, idempotency_key, input]
      description: >-
        生产 Cloud Skill 调用 envelope。Idempotency-Key HTTP header 必须与 body.idempotency_key 相同；
        Cloud API 在签发 Executor 凭据前完成订阅、entitlement、用量和策略门禁。
      properties:
        schema_version: { type: string, const: longhub/cloud-skill-call/v1 }
        request_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._~:-]{0,127}$'
        kind: { type: string, const: skill.execute }
        skill_id:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{2,127}$'
        skill_version:
          type: string
          pattern: '^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$'
        agent_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        tool_call_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._~:-]{0,127}$'
        session_key_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        idempotency_key:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._~:-]{0,127}$'
        plan_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._~:-]{0,127}$'
          description: 可选的候选计划；不能单独授予访问权，也不会转发给 Executor
        input:
          type: object
          description: 仅包含已签名 Skill Schema 允许的业务字段；不得携带身份、幂等或 plan 元数据
          additionalProperties: true
    LegacyTaskCreateRequest:
      type: object
      deprecated: true
      additionalProperties: false
      description: 仅供 allowDevelopmentTasks 测试兼容的旧 envelope，生产 Cloud API 默认拒绝
      required: [kind, input]
      properties:
        kind: { type: string, const: skill.execute }
        input:
          type: object
          description: 旧客户端可在 input 中使用 skillId/planId；不构成生产授权
