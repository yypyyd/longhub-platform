      responses:
        "200": { description: Cloud Plugin tgz, content: { application/gzip: { schema: { type: string, format: binary } } } }
        "410": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /downloads/cloud-cli/{filename}:
    servers: [{ url: https://api.longhub.example.com }]
    get:
      tags: [artifact]
      security: []
      summary: 下载签名 manifest 绑定的 Cloud CLI tgz
      operationId: downloadCloudCliArtifact
      parameters:
        - { name: filename, in: path, required: true, schema: { type: string, pattern: '^longhub-cloud-cli-\d+\.\d+\.\d+\.tgz$' } }
      responses:
        "200": { description: Cloud CLI tgz, content: { application/gzip: { schema: { type: string, format: binary } } } }
        "410": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /artifacts/{artifactId}/download-grant:
    post:
      tags: [artifact]
      summary: 【已废弃】为历史通用制品颁发短期下载许可
