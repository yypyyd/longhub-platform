      tags: [catalog]
      summary: 【已废弃】查看历史套装详情
      deprecated: true
      description: clean launch 的目录仅使用 /catalog/skills；生产关闭 Pack 表面。
      operationId: getPack
      parameters:
        - $ref: "#/components/parameters/PackId"
      responses:
        "200":
          description: 套装详情
          content:
