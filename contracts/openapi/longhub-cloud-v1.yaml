    get:
      tags: [artifact]
      summary: 【已废弃】获取旧 Skill Package 引用签名公钥
      deprecated: true
      description: clean launch 的原生薄适配器使用 /skills/adapters/signing-key。
      operationId: getSkillSigningKey
      security: []
      responses:
        "200":
          description: 与 Agent Pack、客户端更新信任根分离的公钥
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [key_id, public_key_pem]
                properties:
                  key_id: { type: string }
                  public_key_pem: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /skills/adapters/signing-key:
    get:
      tags: [artifact]
      summary: 获取原生 OpenClaw 薄适配器专用 Ed25519 公钥
      operationId: getCloudSkillAdapterSigningKey
      security: []
      description: clean-launch 适配器信任根；客户端应预置并校验公钥，不能把本响应自举为新的信任根。
      responses:
        "200":
          description: 与 Manager 更新及其它制品信任根相互独立的适配器公钥
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [key_id, public_key_pem]
                properties:
                  key_id: { type: string }
                  public_key_pem: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /skills/{skillId}/reference:
    get:
      tags: [artifact]
      summary: 【已废弃】获取旧 Skill Package 签名引用
      deprecated: true
      description: clean launch 使用 /skills/{skillId}/adapter；生产关闭旧引用表面。
      operationId: getSkillReference
      parameters:
        - { name: skillId, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, required: false, schema: { type: string } }
        - { name: openclaw_version, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: 已签名 Skill Package 引用；不包含任意本地代码或下载 URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillReference" }
        "410": { $ref: "#/components/responses/Error" }
        "426": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /skills/{skillId}/adapter:
    get:
      tags: [artifact]
      summary: 获取已订阅且兼容的原生 OpenClaw 薄适配器制品
      description: |
        使用本次 clean launch 新注册的 device + active account/subscription 门禁。
        返回签名 manifest 和恰好三个 canonical Base64 纯内容文件；客户端必须在本地再次验签和校验摘要。
      operationId: getCloudSkillAdapter
      parameters:
        - { name: skillId, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, required: false, schema: { type: string } }
        - { name: openclaw_version, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: 签名薄适配器；响应 no-store，不包含源码、凭据或内部地址
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudSkillAdapterDownload" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /packs/{packId}/download:
    get:
      tags: [artifact]
      summary: 【已废弃】下载历史 Pack 制品
      deprecated: true
      description: clean launch 不分发 Pack 制品；生产关闭。
      operationId: downloadPack
      parameters:
        - $ref: "#/components/parameters/PackId"
        - name: version
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 已签名套装制品
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackDownload"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /admin/packs:
    post:
      tags: [release]
      summary: 【已废弃】管理面发布历史 Pack
      deprecated: true
      description: clean launch 只发布 Cloud Skill adapter。
      operationId: publishPack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest, files]
              properties:
                manifest: {}
                files:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "201":
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackReleaseSummary"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /admin/packs/{packId}/{version}/revoke:
    post:
      tags: [release]
      summary: 【已废弃】管理面撤销历史 Pack 版本
      deprecated: true
      description: clean launch 只撤回 Cloud Skill adapter。
      operationId: revokePackRelease
      parameters:
        - $ref: "#/components/parameters/PackId"
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: 吊销已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackReleaseSummary"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /admin/skills:
    post:
      tags: [release]
      summary: 【已废弃】管理面发布旧 Skill Package
      deprecated: true
      description: clean launch 只发布 Cloud Skill adapter。
      operationId: publishSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [package]
              properties:
                package: { $ref: "#/components/schemas/SkillPackage" }
      responses:
        "201":
          description: 不可覆盖的 Skill 版本已发布
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillReleaseSummary" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /admin/skills/{skillId}/{version}/revoke:
    post:
      tags: [release]
      summary: 【已废弃】管理面撤销旧 Skill Package
      deprecated: true
      description: clean launch 使用 /admin/cloud-skill-adapters/{skillId}/{version}/revoke。
      operationId: revokeSkillRelease
      parameters:
        - { name: skillId, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Skill 版本已撤销
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillReleaseSummary" }
        default: { $ref: "#/components/responses/Error" }
  /admin/cloud-skill-adapters:
    get:
      tags: [release]
      summary: 管理面查询原生 OpenClaw 薄适配器发布元数据
      description: >-
        clean-launch 运营页面使用的只读发布列表。服务端已提供 GET 列表、POST 发布和撤回路由。
        仅返回适配器 manifest 元数据，不返回签名制品正文。
      x-longhub-implementation-status: implemented
      operationId: listCloudSkillAdapters
      parameters:
        - name: skill_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 适配器发布元数据
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [releases]
                properties:
                  releases:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/CloudSkillAdapterReleaseSummary"
                        - type: object
                          properties:
                            min_manager_version: { type: string }
                            openclaw_version: { type: string }
                            compatibility: { $ref: "#/components/schemas/CloudSkillAdapterCompatibility" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [release]
      summary: 管理面发布原生 OpenClaw 薄适配器（服务端重算摘要并签名）
      description: 制品只包含公开 manifest、SKILL.md 和 JSON Schema，不得包含 Cloud Executor 实现、凭据或内部 URL。
      operationId: publishCloudSkillAdapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [manifest, files]
              properties:
                manifest: { $ref: "#/components/schemas/CloudSkillAdapterPublishManifest" }
                files:
                  $ref: "#/components/schemas/CloudSkillAdapterFiles"
      responses:
        "201":
          description: 不可覆盖的适配器版本已发布
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudSkillAdapterReleaseSummary" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /admin/cloud-skill-adapters/{skillId}/{version}/revoke:
    post:
      tags: [release]
      summary: 管理面撤销原生 OpenClaw 薄适配器版本
      operationId: revokeCloudSkillAdapter
      parameters:
        - { name: skillId, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: 适配器版本已撤销
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudSkillAdapterReleaseSummary" }
        default: { $ref: "#/components/responses/Error" }
  /tasks:
    post:
      tags: [task]
      summary: 创建 Cloud Skill 云端任务（幂等）
      description: >-
        clean-launch 唯一的云端执行入口。请求必须绑定设备、Skill 版本、订阅 entitlement、严格 input
        Schema 和 Idempotency-Key；本地 OpenClaw 的其它 Skill 不经过此路径。
      operationId: createTask
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        "201":
          description: 任务已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "200":
          description: 相同 owner 与 Idempotency-Key 的任务重放，返回原任务且不重复计量/执行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: 幂等键绑定冲突或任务输入摘要不同
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Cloud Skill 订阅/entitlement 无效，或周期额度耗尽；本地 OpenClaw 不受影响
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Cloud Skill 每分钟速率或设备并发达到计划上限；响应包含 Retry-After
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: 用量存储或 Executor 暂时不可用；不得降级为未授权执行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /tasks/{taskId}:
    get:
      tags: [task]
      summary: 查询 Cloud Skill 任务状态（严格 owner/Agent 绑定）
      operationId: getTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/TaskAgentId"
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /tasks/{taskId}/cancel:
    post:
      tags: [task]
      summary: 取消 Cloud Skill 任务（幂等）
      operationId: cancelTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/TaskAgentId"
      responses:
        "202":
          description: 取消请求已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /tasks/{taskId}/events:
    get:
      tags: [task]
      summary: 订阅 Cloud Skill 任务进度事件（SSE，支持 Last-Event-ID 断线恢复）
      operationId: streamTaskEvents
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/TaskAgentId"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: SSE 事件流，事件负载见 contracts/events/task-event.v1.schema.json
          content:
            text/event-stream:
              schema:
                type: string
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PackId:
      name: packId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    TaskAgentId:
      name: X-LongHub-Agent-ID
      in: header
      required: false
      description: 当前 OpenClaw Agent 绑定；缺省为 openclaw-default
      schema:
        $ref: "#/components/schemas/TaskAgentIdValue"
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageToken:
      name: page_token
      in: query
      schema:
        type: string
    CloudArtifactVersion:
      name: version
      in: path
      required: true
      schema: { type: string, pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$' }
    CloudArtifactVersionQuery:
      name: version
      in: query
      required: true
      schema: { type: string, pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$' }
    CloudArtifactChannel:
      name: channel
      in: query
      required: false
      schema: { type: string, enum: [stable, beta], default: stable }
  requestBodies:
    CloudArtifactUpload:
      required: true
      content:
        application/octet-stream:
          schema: { type: string, format: binary, maxLength: 134217728 }
    CloudArtifactRollout:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [status, basis_points]
            properties:
              status: { type: string, enum: [active, paused] }
              basis_points: { type: integer, minimum: 0, maximum: 10000 }
  responses:
    Error:
      description: 统一错误响应
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    CloudArtifactReleaseEnvelope:
      description: 签名制品发布；没有开放版本时 release 为 null
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [release]
            properties:
              release:
                oneOf:
                  - { $ref: "#/components/schemas/CloudArtifactReleaseManifest" }
                  - type: "null"
    CloudArtifactSigningKey:
      description: 当前签名公钥，仅供运维核对
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CloudArtifactSigningKey" }
    AdminCloudArtifactReleaseEnvelope:
      description: 管理发布记录
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [release]
            properties:
              release: { $ref: "#/components/schemas/AdminCloudArtifactRelease" }
    AdminCloudArtifactReleaseList:
      description: 管理发布记录列表
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [releases]
            properties:
              releases:
                type: array
                items: { $ref: "#/components/schemas/AdminCloudArtifactRelease" }
  schemas:
    HttpLatencyBuckets:
      type: object
      additionalProperties: false
      required: [lt_100ms, 100_to_200ms, 200_to_300ms, 300_to_500ms, 500_to_800ms, 800ms_to_1s, 1_to_3s, 3_to_5s, gte_5s]
      properties:
        lt_100ms: { type: integer, minimum: 0 }
        100_to_200ms: { type: integer, minimum: 0 }
        200_to_300ms: { type: integer, minimum: 0 }
        300_to_500ms: { type: integer, minimum: 0 }
        500_to_800ms: { type: integer, minimum: 0 }
        800ms_to_1s: { type: integer, minimum: 0 }
        1_to_3s: { type: integer, minimum: 0 }
        3_to_5s: { type: integer, minimum: 0 }
        gte_5s: { type: integer, minimum: 0 }
    HttpRouteOperationalMetric:
      type: object
      additionalProperties: false
      required: [route_id, requests, five_xx, five_xx_rate, latency_buckets, p95_latency_bucket, p95_latency_upper_bound_ms]
      properties:
        route_id:
          type: string
          enum: [cloud_api, health_probe, client_feature_policy, client_runtime_config, skill_catalog, skill_download, skill_release_check]
        requests: { type: integer, minimum: 0 }
        five_xx: { type: integer, minimum: 0 }
        five_xx_rate: { type: [number, "null"], minimum: 0, maximum: 1 }
        latency_buckets: { $ref: "#/components/schemas/HttpLatencyBuckets" }
        p95_latency_bucket:
          type: [string, "null"]
          enum: [lt_100ms, 100_to_200ms, 200_to_300ms, 300_to_500ms, 500_to_800ms, 800ms_to_1s, 1_to_3s, 3_to_5s, gte_5s, null]
        p95_latency_upper_bound_ms: { type: [integer, "null"], minimum: 0 }
    SloReading:
      type: object
      additionalProperties: false
      required: [value, target, status]
      properties:
        value: { type: [number, "null"] }
        target: { type: string }
        status: { type: string, enum: [pass, fail, no_data] }
    OperationalDashboard:
      type: object
      additionalProperties: false
      required: [users_total, devices_total, orders_paid_total, revenue_fen, releases_total, operations, model_usage]
      properties:
        users_total: { type: integer, minimum: 0 }
        devices_total: { type: integer, minimum: 0 }
        orders_paid_total: { type: integer, minimum: 0 }
        revenue_fen: { type: integer }
        releases_total: { type: integer, minimum: 0 }
        operations:
          type: object
          additionalProperties: false
          required: [window_hours, client_starts, previous_exit_clean, previous_exit_unclean, crash_rate, model_requests, model_successes, model_success_rate, model_latency_buckets, update_healthy, update_failed, update_rollback, update_success_rate, product_errors, top_product_errors, manager_versions, http_routes, emergency_disable, service_slo]
          properties:
            window_hours: { type: integer, const: 24 }
            client_starts: { type: integer, minimum: 0 }
            previous_exit_clean: { type: integer, minimum: 0 }
            previous_exit_unclean: { type: integer, minimum: 0 }
            crash_rate: { type: [number, "null"], minimum: 0, maximum: 1 }
            model_requests: { type: integer, minimum: 0 }
            model_successes: { type: integer, minimum: 0 }
            model_success_rate: { type: [number, "null"], minimum: 0, maximum: 1 }
            model_latency_buckets:
              type: object
              additionalProperties: false
              required: [lt_1s, 1_to_3s, 3_to_10s, 10_to_30s, gte_30s]
              properties:
                lt_1s: { type: integer, minimum: 0 }
                1_to_3s: { type: integer, minimum: 0 }
                3_to_10s: { type: integer, minimum: 0 }
                10_to_30s: { type: integer, minimum: 0 }
                gte_30s: { type: integer, minimum: 0 }
            update_healthy: { type: integer, minimum: 0 }
            update_failed: { type: integer, minimum: 0 }
            update_rollback: { type: integer, minimum: 0 }
            update_success_rate: { type: [number, "null"], minimum: 0, maximum: 1 }
            product_errors: { type: integer, minimum: 0 }
            top_product_errors:
              type: array
              maxItems: 5
              items:
                type: object
                additionalProperties: false
                required: [code, count]
                properties:
                  code: { type: string }
                  count: { type: integer, minimum: 0 }
            manager_versions:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [version, count]
                properties:
                  version: { type: string }
                  count: { type: integer, minimum: 0 }
            http_routes:
              type: array
              items: { $ref: "#/components/schemas/HttpRouteOperationalMetric" }
            emergency_disable:
              type: object
              additionalProperties: false
              required: [samples, p95_ms, max_ms, within_5s_rate]
              properties:
                samples: { type: integer, minimum: 0 }
                p95_ms: { type: [integer, "null"], minimum: 0 }
                max_ms: { type: [integer, "null"], minimum: 0 }
                within_5s_rate: { type: [number, "null"], minimum: 0, maximum: 1 }
            service_slo:
              type: object
              additionalProperties: false
              required: [cloud_api_monthly_availability, feature_policy_p95, feature_policy_5xx_rate, runtime_config_5xx_rate, skill_surface_p95, emergency_disable_p95]
              properties:
                cloud_api_monthly_availability:
                  type: object
                  additionalProperties: false
                  required: [value, target, status, source]
                  properties:
                    value: { type: [number, "null"] }
                    target: { type: string }
                    status: { type: string, enum: [pass, fail, no_data] }
                    source: { type: string, const: external_probe }
                feature_policy_p95: { $ref: "#/components/schemas/SloReading" }
                feature_policy_5xx_rate: { $ref: "#/components/schemas/SloReading" }
                runtime_config_5xx_rate: { $ref: "#/components/schemas/SloReading" }
                skill_surface_p95: { $ref: "#/components/schemas/SloReading" }
                emergency_disable_p95: { $ref: "#/components/schemas/SloReading" }
        model_usage:
          type: object
          additionalProperties: false
          required: [requests, input_tokens, output_tokens, cache_tokens, estimated_tokens, cost_microunits]
          properties:
            requests: { type: integer, minimum: 0 }
            input_tokens: { type: integer, minimum: 0 }
            output_tokens: { type: integer, minimum: 0 }
            cache_tokens: { type: integer, minimum: 0 }
            estimated_tokens: { type: integer, minimum: 0 }
            cost_microunits: { type: integer, minimum: 0 }
    ClientUpdateManifest:
      type: object
      additionalProperties: false
      description: >-
        longhub/client-update/v2 签名载荷；product_surface 固定绑定免费 LongHub Manager，只允许 Manager
        产品制品进入 clean-launch 更新通道。字段顺序无关，按共享 canonical JSON 实现签名。
      required: [schema_version, product_surface, sequence, version, channel, platform, arch, filename, size, sha256, url_path, published_at, rollback_data_strategy, rollout]
      properties:
        schema_version: { type: string, const: longhub/client-update/v2 }
        product_surface: { type: string, const: longhub-manager }
        sequence: { type: integer, minimum: 1, maximum: 9007199254740991 }
        version: { type: string, pattern: '^(0|[1-9]\d{0,8})\.(0|[1-9]\d{0,8})\.(0|[1-9]\d{0,8})$' }
        channel: { type: string, enum: [stable, beta] }
        platform: { type: string, const: win32 }
        arch: { type: string, const: x64 }
        filename: { type: string, pattern: '^LongHub-Manager-Setup-\d+\.\d+\.\d+\.exe$' }
        size: { type: integer, minimum: 1, maximum: 1073741824 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        url_path:
          type: string
          pattern: '^/downloads/LongHub-Manager-Setup-\d+\.\d+\.\d+\.exe$'
        published_at: { type: string, format: date-time }
        rollback_data_strategy:
          type: string
          enum: [snapshot_required, backward_compatible]
          description: >-
            snapshot_required 表示程序降级前必须恢复本次更新前的本机快照；backward_compatible 只表示
            clean-launch Manager 版本间的数据格式已验证可直接降级；不得据此导入其它产品面的数据。
        rollout:
          $ref: "#/components/schemas/ClientUpdateRollout"
    ClientUpdateRollout:
      type: object
      additionalProperties: false
      description: 签名保护的暂停与确定性灰度策略；同一版本调整比例时 seed 保持不变。
      required: [status, basis_points, seed, updated_at]
      properties:
        status: { type: string, enum: [active, paused] }
        basis_points: { type: integer, minimum: 0, maximum: 10000 }
        seed: { type: string, pattern: '^[a-f0-9]{64}$' }
        updated_at: { type: string, format: date-time }
    SignedClientUpdateMetadata:
      type: object
      additionalProperties: false
      description: Ed25519 签名覆盖用途域 longhub-client-update-v2、换行符及完整 canonical manifest；不覆盖任何响应外层字段。
      required: [manifest, signature_key_id, signature]
      properties:
        manifest:
          $ref: "#/components/schemas/ClientUpdateManifest"
        signature_key_id: { type: string, pattern: '^[a-zA-Z0-9._-]{1,128}$' }
        signature: { type: string, minLength: 1 }
    ClientUpdateSigningKey:
      type: object
      additionalProperties: false
      required: [purpose, key_id, public_key_pem]
      properties:
        purpose: { type: string, const: longhub-client-update-v2 }
        key_id: { type: string, pattern: '^[a-zA-Z0-9._-]{1,128}$' }
        public_key_pem: { type: string }
    AdminClientRelease:
      type: object
      additionalProperties: false
      required: [manifest, signature_key_id, signature, uploaded_by, uploaded_at, rollout_updated_by, rollout_updated_at, url]
      properties:
        manifest:
          $ref: "#/components/schemas/ClientUpdateManifest"
        signature_key_id: { type: string, pattern: '^[a-zA-Z0-9._-]{1,128}$' }
        signature: { type: string, minLength: 1 }
        uploaded_by: { type: string }
        uploaded_at: { type: string, format: date-time }
        rollout_updated_by: { type: string }
        rollout_updated_at: { type: string, format: date-time }
        url:
          type: string
          pattern: '^/downloads/LongHub-Manager-Setup-\d+\.\d+\.\d+\.exe$'
    CloudArtifactReleaseManifest:
      type: object
      additionalProperties: false
      description: >-
        Ed25519 签名覆盖除 signature 外的完整 canonical JSON；size 与 sha256 绑定同一份不可覆盖 tgz。
        客户端信任根构建时固定，不得从 signing-key 接口替换。
      required: [schema_version, product_surface, sequence, version, channel, platform, arch, filename, size, sha256, url_path, published_at, compatibility, rollout, signature_key_id, signature]
      properties:
        schema_version: { type: string, enum: [longhub/cloud-plugin-release/v1, longhub/cloud-cli-release/v1] }
        product_surface: { type: string, enum: [longhub-cloud-plugin, longhub-cloud-cli] }
        sequence: { type: integer, minimum: 1, maximum: 9007199254740991 }
        version: { type: string, pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$' }
        channel: { type: string, enum: [stable, beta] }
        platform: { type: string, const: win32 }
        arch: { type: string, const: x64 }
        filename:
          type: string
          pattern: '^(longhub-openclaw-cloud-plugin|longhub-cloud-cli)-\d+\.\d+\.\d+\.tgz$'
        size: { type: integer, minimum: 1, maximum: 134217728 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        url_path:
          type: string
          pattern: '^/downloads/(cloud-plugin/longhub-openclaw-cloud-plugin|cloud-cli/longhub-cloud-cli)-\d+\.\d+\.\d+\.tgz$'
        published_at: { type: string, format: date-time }
        compatibility:
          type: object
          additionalProperties: false
          required: [openclaw_version, node]
          properties:
            openclaw_version: { type: string }
            node: { type: string }
        rollout:
          $ref: "#/components/schemas/ClientUpdateRollout"
        signature_key_id: { type: string, pattern: '^[a-zA-Z0-9._-]{1,128}$' }
        signature: { type: string, pattern: '^[A-Za-z0-9+/]{86}==$' }
    CloudArtifactSigningKey:
      type: object
      additionalProperties: false
      required: [purpose, key_id, public_key_pem]
      properties:
        purpose: { type: string, enum: [longhub-cloud-plugin-release-v1, longhub-cloud-cli-release-v1] }
        key_id: { type: string, pattern: '^[a-zA-Z0-9._-]{1,128}$' }
        public_key_pem: { type: string }
    AdminCloudArtifactRelease:
      type: object
      additionalProperties: false
      required: [manifest, uploaded_by, uploaded_at, rollout_updated_by, rollout_updated_at, url]
      properties:
        manifest: { $ref: "#/components/schemas/CloudArtifactReleaseManifest" }
        uploaded_by: { type: string }
        uploaded_at: { type: string, format: date-time }
        rollout_updated_by: { type: string }
        rollout_updated_at: { type: string, format: date-time }
        withdrawn_by: { type: string }
        withdrawn_at: { type: string, format: date-time }
        url:
          type: string
          pattern: '^/downloads/(cloud-plugin/longhub-openclaw-cloud-plugin|cloud-cli/longhub-cloud-cli)-\d+\.\d+\.\d+\.tgz$'
    ClientRuntimeConfig:
      type: object
      additionalProperties: false
      required: [schema_version, config_version, issued_at, expires_at, provider_id, base_path, model_id, display_name, api_type, context_window, max_tokens, allow_user_model_selection, compatible_manager, product, features]
      properties:
        schema_version: { type: string, const: longhub/runtime-config/v1 }
        config_version: { type: string, minLength: 1, maxLength: 128 }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        provider_id: { type: string, const: longhub }
        base_path: { type: string, const: /v1/model }
        model_id: { type: string, const: longhub-default }
        display_name: { type: string, minLength: 1, maxLength: 128 }
        api_type: { type: string, enum: [openai-completions, openai-responses] }
        context_window: { type: integer, minimum: 1024, maximum: 10000000 }
        max_tokens: { type: integer, minimum: 256, maximum: 1000000 }
        allow_user_model_selection: { type: boolean, const: false }
        compatible_manager:
          type: object
          additionalProperties: false
          required: [min_version]
          properties:
            min_version: { type: string }
            max_version: { type: string }
        product:
          type: object
          additionalProperties: false
          required: [assistant_name, assistant_avatar_path, welcome_message, quick_tasks]
          properties:
            assistant_name: { type: string, maxLength: 64 }
            assistant_avatar_path: { type: string, pattern: '^/assets/' }
            welcome_message: { type: string, maxLength: 500 }
            quick_tasks: { type: array, maxItems: 8, items: { type: string, maxLength: 120 } }
        features:
          type: object
          additionalProperties: false
          required: [agent_catalog, file_upload, tool_execution]
          properties:
            agent_catalog: { type: boolean }
            file_upload: { type: boolean }
            tool_execution: { type: boolean }
    ModelInputCapabilities:
      type: object
      additionalProperties: false
      required: [schema_version, model_id, input, file_inputs]
      properties:
        schema_version: { type: string, const: longhub/model-capabilities/v1 }
        model_id: { type: string, const: longhub-default }
        input:
          type: array
          minItems: 1
          maxItems: 2
          prefixItems:
            - { type: string, const: text }
            - { type: string, const: image }
        file_inputs:
          type: object
          additionalProperties: false
          required: [text_extraction, image_understanding]
          properties:
            text_extraction: { type: boolean }
            image_understanding: { type: boolean }
    FeaturePolicyDocument:
      type: object
      additionalProperties: false
      required: [schema_version, policy_version, issued_at, expires_at, features]
      properties:
        schema_version: { type: string, const: longhub/feature-policy/v2 }
        policy_version: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: 与 issued_at 间隔不超过五分钟 }
        features:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/FeaturePolicyEntry" }
    FeaturePolicyEntry:
      type: object
      additionalProperties: false
      required: [feature_id, enabled, scope, audience, mode, risk_level, limits, data_policy, required_entitlements, required_permissions, min_manager_version, emergency_disabled]
      properties:
        feature_id:
          type: string
          enum: [chat.core, session.manage, session.local_search, session.export, file.input, image.input, voice.input, voice.output, knowledge.tenant, knowledge.personal, memory.user_controls, web.search_readonly, url.fetch_readonly, image.generate, agent.catalog, agent.custom_nocode, agent.handoff_summary, skill.catalog, skill.execute, skill.user_content, workflow.user_bounded, automation.reminder, automation.scheduled_read, channel.enterprise, data.export_delete]
        enabled: { type: boolean }
        scope: { type: string, enum: [global, tenant, plan, device, agent] }
        scope_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          description: global 禁止；其余 scope 必填
        audience: { type: string, enum: [user, tenant_admin, platform_admin] }
        mode: { type: string, enum: [default, tenant_controlled, admin_approved] }
        risk_level: { type: string, enum: [low, high] }
        limits:
          type: object
          additionalProperties: false
          properties:
            count: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
            duration_ms: { type: integer, minimum: 0 }
            concurrency: { type: integer, minimum: 0 }
            cost_cents: { type: integer, minimum: 0 }
        data_policy:
          type: object
          additionalProperties: false
          required: [processing_location, retention_days, export_allowed, deletion_allowed]
          properties:
            processing_location: { type: string, enum: [platform_region, tenant_region, device_local] }
            retention_days: { type: integer, minimum: 0, maximum: 3650 }
            export_allowed: { type: boolean }
            deletion_allowed: { type: boolean }
        required_entitlements:
          type: array
          maxItems: 32
          uniqueItems: true
          items: { type: string, pattern: '^[a-z][a-z0-9-]*(?::[a-z0-9_.-]+)*$' }
        required_permissions:
          type: array
          maxItems: 32
          uniqueItems: true
          items: { type: string, pattern: '^[a-z][a-z0-9-]*(?::[a-z0-9_.-]+)+$' }
        min_manager_version: { type: string }
        max_manager_version: { type: string }
        emergency_disabled: { type: boolean }
    FeaturePolicyRecord:
      type: object
      additionalProperties: false
      required: [policy_id, policy, revision, updated_at]
      properties:
        policy_id: { type: string }
        policy: { $ref: "#/components/schemas/FeaturePolicyEntry" }
        revision: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
    AdminModelConfigInput:
      type: object
      additionalProperties: false
      properties:
        config_id: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        scope_type: { type: string, enum: [global, tenant, plan, device] }
        scope_id: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
        enabled: { type: boolean }
        emergency_disabled: { type: boolean }
        base_url: { type: string, format: uri }
        model_id: { type: string }
        display_name: { type: string }
        api_type: { type: string, enum: [openai-completions, openai-responses] }
        context_window: { type: integer, minimum: 1024 }
        max_tokens: { type: integer, minimum: 256 }
        api_key:
          type: string
          writeOnly: true
        fallback_config_id: { type: [string, 'null'] }
        request_timeout_ms: { type: integer, minimum: 1000, maximum: 300000 }
        max_retries: { type: integer, minimum: 0, maximum: 2 }
        min_manager_version: { type: string }
        max_manager_version: { type: [string, 'null'] }
        device_requests_per_minute: { type: integer, minimum: 1 }
        device_daily_tokens: { type: integer, minimum: 1000 }
        tenant_monthly_tokens: { type: integer, minimum: 1000 }
        max_device_concurrency: { type: integer, minimum: 1 }
    ApiError:
      type: object
      required: [code, message, request_id, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        retryable:
          type: boolean
        details: {}
    TaskAgentIdValue:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
      maxLength: 128
    DeviceRegisterRequest:
      type: object
      additionalProperties: false
      description: 首次注册只建立设备身份；租户由 Cloud 在配对/账号流程中分配，客户端不得提交 tenant_id。
      required: [platform, app_version, device_fingerprint]
      properties:
        platform:
          type: string
          enum: [windows, openclaw-plugin-windows]
        app_version:
          type: string
          maxLength: 64
        device_fingerprint:
          type: string
          minLength: 1
          maxLength: 256
        display_name:
          type: string
          maxLength: 128
    CloudSkillPlanInput:
      type: object
      additionalProperties: false
      required: [plan_id, name, skill_ids, price_monthly_fen, price_yearly_fen]
      properties:
        plan_id: { type: string, pattern: '^[a-z][a-z0-9-]*(?:\.[a-z][a-z0-9-]*)*$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        skill_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        price_monthly_fen: { type: integer, minimum: 0 }
        price_yearly_fen: { type: integer, minimum: 0 }
        included_calls:
          type: integer
          minimum: 0
          default: 1000
          description: 当前订阅周期内按 subscription_id + skill_id 计数的调用上限
        requests_per_minute:
          type: integer
          minimum: 1
          default: 60
          description: UTC 固定分钟窗口；同一订阅/租户/用户/设备的多个 Agent 共用
        max_concurrency:
          type: integer
          minimum: 1
          default: 2
          description: 同一订阅/租户/用户/设备的活动执行租约上限
        status: { type: string, enum: [listed, unlisted], default: listed }
    CloudSkillPlanPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        skill_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        price_monthly_fen: { type: integer, minimum: 0 }
        price_yearly_fen: { type: integer, minimum: 0 }
        included_calls: { type: integer, minimum: 0 }
        requests_per_minute: { type: integer, minimum: 1 }
        max_concurrency: { type: integer, minimum: 1 }
        status: { type: string, enum: [listed, unlisted] }
    CloudSkillPlan:
      type: object
      additionalProperties: false
      required: [plan_id, name, skill_ids, price_monthly_fen, price_yearly_fen, included_calls, requests_per_minute, max_concurrency, status, created_at]
      properties:
        plan_id: { type: string, pattern: '^[a-z][a-z0-9-]*(?:\.[a-z][a-z0-9-]*)*$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        skill_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        price_monthly_fen: { type: integer, minimum: 0 }
        price_yearly_fen: { type: integer, minimum: 0 }
        included_calls: { type: integer, minimum: 0 }
        requests_per_minute: { type: integer, minimum: 1 }
        max_concurrency: { type: integer, minimum: 1 }
        status: { type: string, enum: [listed, unlisted] }
        created_at: { type: string, format: date-time }
    OrderCreateRequest:
      type: object
      additionalProperties: false
      required: [type, plan_id, tenant_id, period]
      description: >-
        clean-launch 只接受 `cloud_skill_plan`，使用 plan_id + tenant_id + period；服务端根据已上架计划
        重新计算金额，不信任客户端价格。旧商品和充值请求使用已废弃路径定义，不进入本 Schema。
      properties:
        type: { type: string, const: cloud_skill_plan }
        plan_id: { type: string, maxLength: 128 }
        tenant_id: { type: string, maxLength: 128 }
        period: { type: string, enum: [monthly, yearly] }
    OrderPaymentRequest:
      type: object
      additionalProperties: false
      x-longhub-production-status: payment-provider-pending
      maxProperties: 0
      description: >-
        正式支付 Provider 尚未选定，当前生产请求固定返回 PAYMENT_NOT_CONFIGURED。clean-launch 对外契约
        不接受任何开发测试支付方式；接入真实渠道时必须在同一 OpenAPI 版本中先补齐受信 Provider 请求字段。
    Order:
      type: object
      additionalProperties: false
      required: [order_id, user_id, type, amount_fen, status, created_at]
      description: clean-launch Cloud Skill 订阅订单；不包含旧商品、充值、钱包或余额支付字段。
      properties:
        order_id: { type: string }
        user_id: { type: string }
        type:
          type: string
          const: cloud_skill_plan
        plan_id: { type: string }
        tenant_id: { type: string }
        period: { type: string, enum: [monthly, yearly] }
        amount_fen: { type: integer, minimum: 0 }
        status: { type: string, enum: [pending, paid, cancelled, refunded] }
        created_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time }
        refunded_at: { type: string, format: date-time }
        replayed: { type: boolean, description: 本次请求是否为结算重放 }
        settlement_id: { type: string }
    CloudSkillSubscription:
      type: object
      additionalProperties: false
      required: [subscription_id, user_id, tenant_id, plan_id, status, period, starts_at, expires_at, source_order_id, created_at]
      properties:
        subscription_id: { type: string }
        user_id: { type: string }
        tenant_id: { type: string }
        plan_id: { type: string }
        status: { type: string, enum: [active, cancelled, expired, refunded, suspended] }
        period: { type: string, enum: [monthly, yearly] }
        starts_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        cancelled_at: { type: string, format: date-time }
        refunded_at: { type: string, format: date-time }
        source_order_id: { type: string }
        created_at: { type: string, format: date-time }
    CloudSkillEntitlement:
      type: object
      additionalProperties: false
      required: [entitlement_id, subscription_id, tenant_id, user_id, skill_id, plan_id, status, expires_at, created_at]
      properties:
        entitlement_id: { type: string }
        subscription_id: { type: string }
        tenant_id: { type: string }
        user_id: { type: string }
        skill_id: { type: string }
        plan_id: { type: string }
        status: { type: string, enum: [active, suspended, revoked] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    AccountUser:
      type: object
      additionalProperties: false
      required: [user_id, email, status, created_at]
      description: Cloud 账号的脱敏视图；不包含密码、会话 Token 或本地 OpenClaw 凭据。
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
    AccountDevice:
      type: object
      additionalProperties: false
      required: [device_id, status, created_at]
      description: 当前账号可见的设备脱敏视图；设备 Token 只在注册响应中一次下发。
      properties:
        device_id: { type: string }
        status: { type: string, enum: [active, revoked] }
        platform: { type: string }
        app_version: { type: string }
        display_name: { type: string }
        created_at: { type: string, format: date-time }
    Device:
      type: object
      additionalProperties: false
      required: [device_id, tenant_id, status, platform, app_version, device_fingerprint, device_token, created_at]
      description: >-
        本次 clean launch 新注册设备的 Cloud API 身份；不代表本地 OpenClaw 的产品激活或能力授权。
        device_token 仅在新注册响应中下发。
      properties:
        device_id:
          type: string
        tenant_id:
          type: string
        status:
          type: string
          enum: [active, revoked]
        platform: { type: string, enum: [windows, openclaw-plugin-windows] }
        app_version: { type: string }
        device_fingerprint: { type: string }
        display_name: { type: string }
        user_id: { type: string }
        created_at:
          type: string
          format: date-time
        device_token:
          type: string
          description: 设备凭据，仅注册响应下发；客户端保存后作为 Bearer 凭据访问受保护接口
    DevicePairingChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id, device_id, expires_at, pairing_code]
      description: longhub-cloud CLI 生成的短期一次性配对证明；Cloud 只保存 pairing_code 摘要。
      properties:
        challenge_id: { type: string }
        device_id: { type: string }
        expires_at: { type: string, format: date-time }
        pairing_code:
          type: string
          pattern: '^[A-HJ-NP-Z2-9]{12}$'
          description: 只在本次 CLI 响应中下发的明文配对码
    DeviceSelf:
      type: object
      additionalProperties: false
      required: [device_id, status, platform, app_version, bound, created_at]
      description: 当前 bearer 对应设备的脱敏状态；永不包含 device_token 或设备指纹。
      properties:
        device_id: { type: string }
        status: { type: string, enum: [active, revoked] }
        platform: { type: string, enum: [windows, openclaw-plugin-windows] }
        app_version: { type: string }
        display_name: { type: string }
        bound: { type: boolean }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    DeviceActivationStatus:
      type: object
      deprecated: true
      description: 历史授权码激活响应；clean-launch 不使用该 Schema。
      required: [device_id, activated]
      properties:
        device_id: { type: string, description: 历史响应中的设备标识；生产路径关闭且不用于迁移 }
        activated: { type: boolean }
        reason:
          type: string
          enum: [ACTIVATION_REQUIRED, ACTIVATION_REVOKED, ACTIVATION_EXPIRED]
        expires_at: { type: string, format: date-time }
        code_hint: { type: string, description: 授权码最后四位，不返回明文 }
    ClientTelemetryBatch:
      type: object
      additionalProperties: false
      required: [schema_version, events]
      properties:
        schema_version: { type: string, const: longhub/client-telemetry/v1 }
        events:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/ClientTelemetryEvent"
    ClientTelemetryEvent:
      oneOf:
        - $ref: "#/components/schemas/ClientStartedTelemetryEvent"
        - $ref: "#/components/schemas/GatewayStateTelemetryEvent"
        - $ref: "#/components/schemas/ClientUpdateTelemetryEvent"
        - $ref: "#/components/schemas/ProductErrorTelemetryEvent"
        - $ref: "#/components/schemas/PreviousExitTelemetryEvent"
    ClientTelemetryCommon:
      type: object
      properties:
        occurred_at: { type: string, format: date-time, description: 服务端只接受前后十五分钟窗口 }
        manager_version: { type: string, maxLength: 64 }
        openclaw_version: { type: string, maxLength: 64 }
        platform: { type: string, enum: [win32] }
        architecture: { type: string, enum: [x64, arm64] }
    ClientStartedTelemetryEvent:
      allOf:
        - $ref: "#/components/schemas/ClientTelemetryCommon"
        - type: object
          additionalProperties: false
          required: [event_type, occurred_at, manager_version, openclaw_version, platform, architecture, fields]
          properties:
            event_type: { type: string, const: client_started }
            occurred_at: { type: string, format: date-time }
            manager_version: { type: string, maxLength: 64 }
