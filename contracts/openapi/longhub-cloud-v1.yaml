  /cloud-cli-releases/latest:
    get:
      tags: [release, artifact]
      security: []
      summary: 获取最新已开放的签名 longhub-cloud CLI tgz 元数据
      operationId: getLatestCloudCliRelease
      parameters:
        - { name: channel, in: query, required: false, schema: { type: string, enum: [stable, beta], default: stable } }
      responses:
        "200": { $ref: "#/components/responses/CloudArtifactReleaseEnvelope" }
