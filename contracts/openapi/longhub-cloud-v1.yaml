  /cloud-skill-plans:
    get:
      tags: [billing]
      security: []
      summary: 返回公开上架的 Cloud Skill 计划
      description: clean-launch 唯一公开销售目录；只返回 listed 计划的价格、额度和 Skill 元数据，不返回实现或秘密。
      operationId: listCloudSkillPlans
      responses:
        "200":
          description: 计划价格、Skill allow-list 与限制元数据；不包含实现或秘密
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [plans]
                properties:
                  plans:
                    type: array
                    items: { $ref: "#/components/schemas/CloudSkillPlan" }
        default:
          $ref: "#/components/responses/Error"
  /orders:
    post:
      tags: [billing]
      summary: 创建 Cloud Skill 订阅订单
      description: >-
        clean-launch 只接受 type=cloud_skill_plan；金额由服务端根据已上架的 plan_id 与 period 重算，
        不信任客户端价格。旧商品、充值和余额流程不属于本端点。
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCreateRequest" }
      responses:
        "201":
          description: 待支付订单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409": { $ref: "#/components/responses/Error" }
        "422":
          description: 输入无效（INVALID_ORDER 等）
          content:
            application/json: { schema: { $ref: "#/components/schemas/ApiError" } }
        default: { $ref: "#/components/responses/Error" }
  /orders/{orderId}/pay:
    post:
      tags: [billing]
      summary: 支付当前账号的待支付订单
      x-longhub-production-status: payment-provider-pending
      description: >-
        仅用于真实支付通道接入后的 Cloud Skill 订单。当前尚未接入正式支付，生产返回
        PAYMENT_NOT_CONFIGURED；任何开发 fixture 支付方式都不属于对外产品契约，也不得出现在页面。
      operationId: payOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[!-~]+$'
          description: 相同订单与请求绑定下可安全重放；缺省时服务端使用订单派生键
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderPaymentRequest" }
      responses:
        "200":
          description: 已支付订单；Cloud Skill 订阅发放必须可重放且只能产生对应 Cloud Skill entitlement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "402": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422":
          description: 正式支付通道接入后的请求参数无效（当前生产不会进入该分支）
          content:
            application/json: { schema: { $ref: "#/components/schemas/ApiError" } }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /admin/orders/{orderId}/refund:
    post:
      tags: [billing]
      summary: 管理面退款 Cloud Skill 订单并撤销权益
      x-longhub-production-status: payment-provider-pending
      description: >-
        只处理 clean-launch 的 Cloud Skill 订单；当前尚未接入正式支付退款，生产返回
        PAYMENT_NOT_CONFIGURED。接入后，退款与 subscription/entitlement 撤销必须在同一事务或可恢复 outbox 中完成。
      operationId: refundOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[!-~]+$'
          description: 相同订单退款请求可安全重放；缺省时服务端使用订单派生键
      responses:
        "200":
          description: 已退款订单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: 订单状态不可退款或幂等请求与原请求冲突
          content:
            application/json: { schema: { $ref: "#/components/schemas/ApiError" } }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /me/cloud-skill-subscriptions:
    get:
