  /devices/activate:
    post:
      tags: [identity]
      summary: 【已废弃】核销历史授权码
      deprecated: true
      description: clean launch 不使用授权码；生产返回 LEGACY_SURFACE_DISABLED。
      operationId: activateDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^LH-(?:[A-Fa-f0-9]{4}-){3}[A-Fa-f0-9]{4}$' }
      responses:
        "200": { description: 激活成功 }
        "403": { $ref: "#/components/responses/Error" }
        "429":
          description: 设备级或公网入口 IP/全局限流；客户端按 Retry-After 退避
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        default:
          $ref: "#/components/responses/Error"
  /client/telemetry:
    post:
