  /cloud-cli-releases/signing-key:
    get:
      tags: [artifact]
      security: []
      summary: 获取 Cloud CLI 当前签名公钥，仅供运维核对
      operationId: getCloudCliSigningKey
      responses:
        "200": { $ref: "#/components/responses/CloudArtifactSigningKey" }
        default: { $ref: "#/components/responses/Error" }
  /cloud-cli-releases/versions/{version}:
    get:
      tags: [release, artifact]
