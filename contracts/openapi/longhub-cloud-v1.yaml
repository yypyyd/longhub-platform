      deprecated: true
      description: clean launch 的适配器信任使用 /skills/adapters/signing-key。
      operationId: getSigningKey
      security: []
      responses:
        "200":
          description: 发布签名公钥
          content:
            application/json:
              schema:
                type: object
                required: [key_id, public_key_pem]
                properties:
                  key_id:
                    type: string
                  public_key_pem:
                    type: string
