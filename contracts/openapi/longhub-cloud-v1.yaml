    get:
      tags: [billing]
      summary: 列出当前 registered device 上的 Cloud Skill Agent 绑定
      description: clean-launch 绑定只关联原生 OpenClaw Agent 与 Cloud Skill entitlement，不改变本地其它能力。
      operationId: listCloudSkillBindings
      responses:
        "200":
          description: 仅返回当前设备/租户拥有的 server-owned binding
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [bindings]
                properties:
                  bindings:
                    type: array
                    items: { $ref: "#/components/schemas/CloudAgentSkillBinding" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [billing]
      summary: 为当前设备的原生 OpenClaw Agent 绑定 Cloud Skill
      description: 绑定是云端执行准入的一部分；每次 /tasks 仍会重新校验订阅、版本、Agent 和设备。
      operationId: upsertCloudSkillBinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agent_id, skill_id]
              properties:
                agent_id: { $ref: "#/components/schemas/TaskAgentIdValue" }
                skill_id: { type: string }
                user_id: { type: string }
      responses:
        "200":
          description: 已存在且保持不变的绑定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudAgentSkillBindingEnvelope" }
        "201":
          description: 新建绑定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudAgentSkillBindingEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /cloud-skill/bindings/{bindingId}:
    delete:
      tags: [billing]
      summary: 撤销当前设备拥有的 Cloud Skill Agent 绑定
      description: 撤销只阻断对应 Cloud Skill 任务，不停止或修改用户原生 OpenClaw。
      operationId: revokeCloudSkillBinding
      parameters:
        - { name: bindingId, in: path, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          description: 绑定已撤销
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudAgentSkillBindingEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /admin/cloud-skill-plans:
    get:
      tags: [billing]
      summary: 管理面列出全部 Cloud Skill 计划
      operationId: listAdminCloudSkillPlans
      responses:
        "200":
          description: 包括未上架计划
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [plans]
                properties:
                  plans:
                    type: array
                    items: { $ref: "#/components/schemas/CloudSkillPlan" }
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [billing]
      summary: 管理面创建 Cloud Skill 计划
      operationId: createAdminCloudSkillPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudSkillPlanInput" }
      responses:
        "201":
          description: 计划已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudSkillPlan" }
        default:
          $ref: "#/components/responses/Error"
  /admin/cloud-skill-plans/{planId}:
    post:
      tags: [billing]
      summary: 管理面更新 Cloud Skill 计划
      operationId: updateAdminCloudSkillPlan
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudSkillPlanPatch" }
      responses:
        "200":
          description: 计划已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudSkillPlan" }
        default:
          $ref: "#/components/responses/Error"
  /admin/cloud-skill-subscriptions:
    get:
      tags: [billing]
      summary: 管理面列出 Cloud Skill 订阅
      operationId: listAdminCloudSkillSubscriptions
      responses:
        "200":
          description: 订阅列表
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [subscriptions]
                properties:
                  subscriptions:
                    type: array
                    items: { $ref: "#/components/schemas/CloudSkillSubscription" }
        default:
          $ref: "#/components/responses/Error"
  /catalog/skills:
    get:
      tags: [catalog]
      summary: 列出策略允许且与当前 Manager/OpenClaw 兼容的 Cloud Skill 适配器
      description: >-
        设备视角的免费目录；只返回已注册设备可见、未撤回且兼容的 Cloud Skill 元数据。Feature Policy
        作用于目录和云端任务，不限制用户原生 OpenClaw 的其它 Skill、插件或模型。
      operationId: listSkills
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: openclaw_version, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: 未撤销的兼容 Skill 列表；entitled 仅表示可取得引用，不表示执行授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillCatalogList"
        default: { $ref: "#/components/responses/Error" }
  /catalog/skills/{skillId}:
    get:
      tags: [catalog]
      summary: 查看策略允许且兼容的 Cloud Skill 详情
      description: 不下发签名适配器正文；需要下载时使用 /skills/{skillId}/adapter 并再次校验订阅权益。
      operationId: getSkill
      parameters:
        - { name: skillId, in: path, required: true, schema: { type: string } }
        - { name: openclaw_version, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Skill 详情
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [skill]
                properties:
                  skill: { $ref: "#/components/schemas/SkillCatalogItem" }
        default: { $ref: "#/components/responses/Error" }
  /client-releases/latest:
    get:
      tags: [release, artifact]
      summary: 获取最新的严格签名 Windows LongHub Manager 更新元数据
      description: >-
        只返回 product_surface=longhub-manager 的发布；Manager 使用安装包内预置公钥验签，不得通过
        signing-key 接口自举信任。
      operationId: getLatestClientRelease
      security: []
      parameters:
        - name: channel
          in: query
          required: false
          schema:
            type: string
            enum: [stable, beta]
            default: stable
      responses:
        "200":
          description: 最新已签名版本；当前渠道没有可用版本时 release 为 null
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [release]
                properties:
                  release:
                    oneOf:
                      - $ref: "#/components/schemas/SignedClientUpdateMetadata"
                      - type: "null"
        default:
          $ref: "#/components/responses/Error"
  /client-releases/signing-key:
    get:
      tags: [artifact]
      summary: 获取当前 Manager 更新签名公钥，仅供运维核对与轮换发现
      description: LongHub Manager 不得信任本响应建立根信任；正式信任公钥必须在构建时预置。
      operationId: getClientUpdateSigningKey
      security: []
      responses:
        "200":
          description: 当前 LongHub Manager 更新签名公钥
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientUpdateSigningKey"
        default:
          $ref: "#/components/responses/Error"
  /client-releases/versions/{version}:
    get:
      tags: [release, artifact]
      summary: 获取指定 Windows LongHub Manager 版本的严格签名元数据
      description: 仅供已安装 Manager 在升级前准备回滚安装器；只返回 Manager 产品面，不执行灰度判断，也不改变“最新版本”语义。
      operationId: getClientReleaseVersion
      security: []
      parameters:
        - name: version
          in: path
          required: true
          schema: { type: string, pattern: '^(0|[1-9]\d{0,8})\.(0|[1-9]\d{0,8})\.(0|[1-9]\d{0,8})$' }
        - name: channel
          in: query
          required: false
          schema: { type: string, enum: [stable, beta], default: stable }
      responses:
        "200":
          description: 指定渠道与版本的签名元数据
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [release]
                properties:
                  release:
                    $ref: "#/components/schemas/SignedClientUpdateMetadata"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /admin/client-releases:
    get:
      tags: [release, artifact]
      summary: 管理面列出已签名 LongHub Manager 安装包
      operationId: listAdminClientReleases
      responses:
        "200":
          description: 已签名 Manager 发布列表及上传审计字段
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [releases]
                properties:
                  releases:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminClientRelease"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [release, artifact]
      summary: 管理面流式上传并签署不可覆盖的 Windows 安装包
      operationId: publishClientRelease
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: string, pattern: '^(0|[1-9]\d{0,8})\.(0|[1-9]\d{0,8})\.(0|[1-9]\d{0,8})$' }
        - name: filename
          in: query
          required: true
          description: 必须精确等于 LongHub-Manager-Setup-{version}.exe；旧 LongHub-Setup-{version}.exe 不属于首发契约
          schema: { type: string, pattern: '^LongHub-Manager-Setup-\d+\.\d+\.\d+\.exe$' }
        - name: channel
          in: query
          required: false
          schema: { type: string, enum: [stable, beta], default: stable }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 1073741824
      responses:
        "201":
          description: 已计算大小与 SHA-256、分配单调序列并签署元数据
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [release]
                properties:
                  release:
                    $ref: "#/components/schemas/AdminClientRelease"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /admin/client-releases/{version}/rollout:
    patch:
      tags: [release, artifact]
      summary: 调整当前渠道最新 Manager 版本的签名灰度或暂停策略
      description: 每次变更保留固定 cohort seed、分配更高全局 sequence，并重新签署完整 manifest。
      operationId: updateClientReleaseRollout
      parameters:
        - name: version
          in: path
          required: true
          schema: { type: string, pattern: '^(0|[1-9]\d{0,8})\.(0|[1-9]\d{0,8})\.(0|[1-9]\d{0,8})$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, basis_points]
              properties:
                status: { type: string, enum: [active, paused] }
                basis_points:
                  type: integer
                  minimum: 0
                  maximum: 10000
                  description: active 时必须大于 0；10000 表示 100%。
      responses:
        "200":
          description: 已分配更高 sequence 并重新签名的发布记录
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [release]
                properties:
                  release:
                    $ref: "#/components/schemas/AdminClientRelease"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /cloud-plugin-releases/latest:
    get:
      tags: [release, artifact]
      security: []
      summary: 获取最新已开放的签名 Cloud Plugin tgz 元数据
      operationId: getLatestCloudPluginRelease
