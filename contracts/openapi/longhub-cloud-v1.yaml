      operationId: grantArtifactDownload
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 下载许可
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadGrant"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /packs/signing-key:
    get:
      tags: [artifact]
