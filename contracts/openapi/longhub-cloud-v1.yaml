          additionalProperties: false
          required: [manifest, files]
          properties:
            manifest: { $ref: "#/components/schemas/CloudSkillAdapterManifest" }
            files: { $ref: "#/components/schemas/CloudSkillAdapterFiles" }
        digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        signature_key_id: { type: string }
    CloudSkillAdapterCompatibility:
