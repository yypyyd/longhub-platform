openapi: 3.1.0
info:
  title: LongHub Cloud API
  description: >-
    龙枢 Cloud API REST 契约 V1。当前有效产品表面是 clean launch：免费原生 OpenClaw 管家与 Cloud
    Skill 订阅；尚未上线，不为旧客户端/旧设备提供迁移承诺。历史 Pack、激活码、钱包和本地模型代理路径
    保留在契约中仅供审计，并标记为 deprecated；生产 Cloud API 关闭这些表面，也不提供旧数据迁移或
    兼容入口。首次上线前的破坏性调整直接收敛到本 clean-launch 契约；上线后的破坏性变更必须创建新主版本。
  version: "1.0.0"
  x-longhub-product-surface: clean-launch
  x-longhub-deployment-status: not-launched
  x-longhub-legacy-surface: disabled-in-production
  x-longhub-current-paths:
    - /health
    - /devices/register
    - /client/feature-policy
    - /client/telemetry
    - /cloud-skill-plans
    - /auth/register
    - /auth/login
    - /auth/logout
    - /me
    - /me/orders
    - /me/devices
    - /devices/pairing/challenge
    - /devices/self
    - /devices/self/revoke
    - /me/devices/pair
    - /me/cloud-skill-subscriptions
    - /me/cloud-skill-subscriptions/{subscriptionId}/cancel
    - /me/cloud-skill-entitlements
    - /orders
    - /orders/{orderId}/pay
    - /catalog/skills
    - /catalog/skills/{skillId}
    - /skills/{skillId}/adapter
    - /cloud-skill/bindings
    - /cloud-skill/bindings/{bindingId}
    - /tasks
    - /tasks/{taskId}
    - /tasks/{taskId}/events
    - /tasks/{taskId}/cancel
    - /admin/auth/login
    - /admin/feature-policies
    - /admin/cloud-skill-plans
    - /admin/cloud-skill-plans/{planId}
    - /admin/cloud-skill-subscriptions
    - /admin/orders
    - /admin/orders/{orderId}/refund
    - /admin/users
    - /admin/users/{userId}/status
    - /admin/devices
    - /admin/devices/{deviceId}
    - /admin/devices/{deviceId}/rotate-credential
    - /admin/metrics
    - /admin/audits
    - /admin/model-config
    - /admin/model-policies
    - /admin/model-usage
    - /admin/cloud-skill-adapters
    - /admin/cloud-skill-adapters/{skillId}/{version}/revoke
    - /skills/adapters/signing-key
    - /client-releases/latest
    - /client-releases/signing-key
    - /client-releases/versions/{version}
    - /admin/client-releases
    - /admin/client-releases/{version}/rollout
    - /cloud-plugin-releases/latest
    - /cloud-plugin-releases/signing-key
    - /cloud-plugin-releases/versions/{version}
    - /cloud-cli-releases/latest
    - /cloud-cli-releases/signing-key
    - /cloud-cli-releases/versions/{version}
    - /admin/cloud-plugin-releases
    - /admin/cloud-plugin-releases/{version}/rollout
    - /admin/cloud-plugin-releases/{version}
    - /admin/cloud-cli-releases
    - /admin/cloud-cli-releases/{version}/rollout
    - /admin/cloud-cli-releases/{version}
servers:
  - url: https://api.longhub.example.com/v1
tags:
  - name: identity
    description: OIDC、用户、租户、设备
  - name: catalog
    description: Cloud Skill 目录（历史套装路径仅供审计，生产关闭）
  - name: entitlement
    description: 租户/用户/设备授权与撤销
  - name: billing
    description: Cloud Skill 计划、订阅与执行额度/速率/并发门禁
  - name: release
    description: 版本、渠道、灰度、兼容与吊销
  - name: artifact
    description: 制品、摘要、签名与下载许可
  - name: task
    description: 云端任务、状态、幂等与事件
  - name: model
    description: Cloud Executor 内部模型路由；不控制用户原生 OpenClaw 模型
  - name: telemetry
    description: 严格匿名、仅聚合的客户端运行指标
  - name: knowledge
    description: 历史知识文档与引用检索；不进入 clean-launch 首发
  - name: governance
    description: 历史制品审核记录；clean launch 不作为销售或安装入口
  - name: policy
    description: Feature Policy V2 下发、管理与服务端执行复验
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [telemetry]
      security: []
      summary: 外部可用率探测；不返回版本、主机或依赖详情
      operationId: getHealth
      responses:
        "200":
          description: Cloud API 进程可接受请求
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /client/runtime-config:
    get:
      tags: [model]
      summary: 【已废弃】获取旧客户端的固定 OpenClaw 模型运行配置
      deprecated: true
      description: clean launch 不代理或强制用户原生 OpenClaw 模型；生产旧表面返回 LEGACY_SURFACE_DISABLED。
      operationId: getClientRuntimeConfig
      responses:
        "200":
          description: 固定模型配置（不包含上游模型 ID/API Key）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuntimeConfig"
        default:
          $ref: "#/components/responses/Error"
  /client/model-capabilities:
    get:
      tags: [model]
      summary: 【已废弃】获取旧客户端固定模型的文本/视觉输入能力
      deprecated: true
      description: clean launch 的 Cloud Skill 模型能力由 Executor 内部路由决定，不下发给本地 OpenClaw。
      operationId: getClientModelCapabilities
      responses:
        "200":
          description: 当前设备实际选定模型的输入能力；客户端失败时降级为 text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelInputCapabilities"
        default:
          $ref: "#/components/responses/Error"
  /client/feature-policy:
    get:
      tags: [policy]
      summary: 获取当前设备适用的 LongHub/Cloud Skill Feature Policy V2
      description: 仅控制 LongHub 自有页面与 Cloud Skill 目录/任务；不得限制用户原生 OpenClaw 能力。
      operationId: getClientFeaturePolicy
      parameters:
        - name: X-LongHub-Manager-Version
          in: header
          required: false
          description: 已认证设备当前实际运行版本；Cloud 只更新该凭据所属设备的版本记录
          schema:
            type: string
            maxLength: 64
            pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
      responses:
        "200":
          description: 最长五分钟有效的严格策略文档
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturePolicyDocument"
        "304":
          description: 同一三十秒刷新窗口内策略未变化
        "422":
          description: 客户端版本请求头不是受限语义版本
        "429":
          description: 公网入口按来源 IP 或全局共享桶限流；客户端按 Retry-After 退避
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        default:
          $ref: "#/components/responses/Error"
  /admin/feature-policies:
    get:
      tags: [policy]
      summary: 管理面列出 Feature Policy V2 记录
      operationId: listAdminFeaturePolicies
      responses:
        "200":
          description: 策略记录列表
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [policies]
                properties:
                  policies:
                    type: array
                    maxItems: 64
                    items: { $ref: "#/components/schemas/FeaturePolicyRecord" }
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [policy]
      summary: 按 feature/audience/scope/target 原子新增或更新策略
      operationId: upsertAdminFeaturePolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [policy]
              properties:
                policy: { $ref: "#/components/schemas/FeaturePolicyEntry" }
      responses:
        "200": { description: 已更新 }
        "201": { description: 已创建 }
        default:
          $ref: "#/components/responses/Error"
  /model/models:
    get:
      tags: [model]
      summary: 【已废弃】旧客户端 OpenAI 兼容模型列表
      deprecated: true
      description: clean launch 不为用户原生 OpenClaw 提供强制模型代理。
      operationId: listClientModels
      responses:
        "200":
          description: 固定模型列表
        default:
          $ref: "#/components/responses/Error"
  /model/chat/completions:
    post:
      tags: [model]
      summary: 【已废弃】旧客户端 Chat Completions 模型代理
      deprecated: true
      description: clean launch 不代理用户本地对话；Cloud Skill 只通过 /tasks 进入私网 Executor。
      operationId: proxyChatCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: 上游 OpenAI 兼容响应或 SSE 流 }
        default:
          $ref: "#/components/responses/Error"
  /model/responses:
    post:
      tags: [model]
      summary: 【已废弃】旧客户端 Responses API 模型代理
      deprecated: true
      description: clean launch 不代理用户本地对话；Cloud Skill 只通过 /tasks 进入私网 Executor。
      operationId: proxyResponses
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: 上游 OpenAI 兼容响应或 SSE 流 }
        default:
          $ref: "#/components/responses/Error"
  /admin/model-config:
    get:
      tags: [model]
      summary: 管理面读取 Cloud Executor 模型路由（API Key 只返回是否已配置）
      description: 仅供 LongHub Cloud Skill 私网 Executor 使用；不下发或强制用户原生 OpenClaw 模型。
      operationId: getAdminModelConfig
      responses:
        "200": { description: 模型配置脱敏视图 }
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [model]
      summary: 管理面更新 Cloud Executor 模型路由；API Key 加密入库
      description: 仅改变云端 Skill 的服务端路由；不改变用户本地 Provider、模型或 Channels。
      operationId: updateAdminModelConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminModelConfigInput"
      responses:
        "200": { description: 已保存的脱敏配置 }
        default:
          $ref: "#/components/responses/Error"
  /admin/model-policies:
    get:
      tags: [model]
      summary: 列出 Cloud Executor 的 global/tenant/plan/device 路由策略
      description: 策略作用于云端任务；不得被解释为用户原生 OpenClaw 的能力开关。
      operationId: listAdminModelPolicies
      responses:
        "200": { description: 不含上游密钥的策略列表 }
        default: { $ref: "#/components/responses/Error" }
  /admin/model-usage:
    get:
      tags: [model]
      summary: 查询 Cloud Executor 的日/月模型计量聚合
      description: 只用于云端成本、额度和健康运营，不统计或限制用户本地模型。
      operationId: listAdminModelUsage
      responses:
        "200": { description: 模型 Token、成本和结果聚合 }
        default: { $ref: "#/components/responses/Error" }
  /admin/devices:
    get:
      tags: [identity]
      summary: 列出设备运营状态；不返回设备凭据或指纹
      operationId: listAdminDevices
      responses:
        "200": { description: 设备列表、最后在线/模型成功、错误摘要与策略字段 }
        default: { $ref: "#/components/responses/Error" }
  /admin/devices/{deviceId}:
    post:
      tags: [identity]
      summary: 停用或恢复设备，并设置最低客户端版本和灰度分组
      operationId: updateAdminDevicePolicy
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { type: string, enum: [active, revoked] }
                min_required_version: { type: [string, "null"] }
                rollout_group: { type: [string, "null"] }
      responses:
        "200": { description: 已更新的脱敏设备记录 }
        default: { $ref: "#/components/responses/Error" }
  /admin/devices/{deviceId}/rotate-credential:
    post:
      tags: [identity]
      summary: 轮换设备凭据；新凭据只在本次响应返回，旧凭据立即失效
      operationId: rotateAdminDeviceCredential
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 一次性新设备凭据 }
        default: { $ref: "#/components/responses/Error" }
  /admin/knowledge-documents:
    get:
      tags: [knowledge]
      summary: 【已废弃】按租户列出历史知识文档元数据
      deprecated: true
      description: clean launch 首发不提供知识库产品面；生产关闭该路径。
      operationId: listKnowledgeDocuments
      parameters:
        - { name: tenant_id, in: query, required: false, schema: { type: string, default: tenant-default } }
      responses:
        "200": { description: 知识文档元数据列表 }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [knowledge]
      summary: 【已废弃】写入历史租户知识文档
      deprecated: true
      description: clean launch 首发不接收知识文档；生产关闭该路径。
      operationId: createKnowledgeDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenant_id, title, source_label, content]
              properties:
                tenant_id: { type: string, maxLength: 128 }
                title: { type: string, maxLength: 200 }
                source_label: { type: string, maxLength: 200 }
                content: { type: string, minLength: 1, maxLength: 1048576 }
      responses:
        "201": { description: 已创建的文档元数据 }
        default: { $ref: "#/components/responses/Error" }
  /admin/knowledge-documents/{documentId}:
    delete:
      tags: [knowledge]
      summary: 【已废弃】删除历史知识文档
      deprecated: true
      description: clean launch 首发不提供知识库产品面；生产关闭该路径。
      operationId: deleteKnowledgeDocument
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 删除成功 }
        default: { $ref: "#/components/responses/Error" }
  /knowledge/query:
    post:
      tags: [knowledge]
      summary: 【已废弃】检索历史租户知识引用片段
      deprecated: true
      description: clean launch 首发不提供知识库产品面；生产关闭该路径。
      operationId: queryTenantKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: { type: string, minLength: 2, maxLength: 500 }
                limit: { type: integer, minimum: 1, maximum: 10, default: 5 }
      responses:
        "200": { description: 标题、来源和确定性引用片段 }
        default: { $ref: "#/components/responses/Error" }
  /admin/pack-reviews:
    get:
      tags: [governance]
      summary: 【已废弃】列出历史第三方 Pack 审核记录
      deprecated: true
      description: clean launch 不发布 Pack；仅保留历史审计记录，生产不作为安装或销售入口。
      operationId: listPackReviews
      responses:
        "200": { description: 审核记录与固定扫描发现 }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [governance]
      summary: 【已废弃】提交历史第三方 Pack 审核
      deprecated: true
      description: clean launch 不接受 Pack 制品；生产返回 LEGACY_SURFACE_DISABLED。
      operationId: submitPackReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publisher, pack]
              properties:
                publisher: { type: string, minLength: 1, maxLength: 128 }
                pack: { type: object }
      responses:
        "201": { description: 扫描通过并进入待批准状态 }
        "422": { description: 扫描拒绝；响应返回固定 findings }
        default: { $ref: "#/components/responses/Error" }
  /admin/pack-reviews/{reviewId}/approve:
    post:
      tags: [governance]
      summary: 【已废弃】批准历史 Pack 审核并发布
      deprecated: true
      description: clean launch 不发布 Pack 版本。
      operationId: approvePackReview
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: 已签名发布 }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /devices/register:
    post:
      tags: [identity]
      summary: 登记设备并颁发设备凭据
      description: clean launch 的设备注册只建立 Cloud API 身份；不需要产品激活码，也不限制本地 OpenClaw。
      operationId: registerDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegisterRequest"
      responses:
        "201":
          description: 设备注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "4XX":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /devices/pairing/challenge:
    post:
      tags: [identity]
      summary: 由已登记 Cloud Plugin 设备生成一次性账号配对码
      description: >-
        只接受设备 Bearer 和空 JSON 对象。配对码有效 10 分钟且仅可消费一次；明文只在本响应中下发，
        云端仅保存摘要。该接口不能选择其他 device_id、tenant 或有效期。
      operationId: createDevicePairingChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "201":
          description: 一次性配对码已生成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevicePairingChallenge" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /devices/self:
    get:
      tags: [identity]
      summary: 查询当前 Cloud Plugin 设备状态
      description: 只返回当前设备的脱敏元数据、绑定状态和版本，不返回 device_token。
      operationId: getCurrentDevice
      responses:
        "200":
          description: 当前设备状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSelf" }
        default: { $ref: "#/components/responses/Error" }
  /devices/self/revoke:
    post:
      tags: [identity]
      summary: 撤销当前 Cloud Plugin 设备凭据
      description: 只允许 bearer 撤销其自身设备；成功后该 bearer 立即失效并写入审计。
      operationId: revokeCurrentDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: 当前设备已撤销
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [device_id, status]
                properties:
                  device_id: { type: string }
                  status: { type: string, const: revoked }
        default: { $ref: "#/components/responses/Error" }
  /auth/register:
    post:
      tags: [identity]
      security: []
      summary: 注册 LongHub Cloud 账号
      description: 账号只用于 Cloud Skill 目录、设备和订阅；注册不是本地 OpenClaw 的前置条件。
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                password: { type: string, minLength: 8, maxLength: 256, writeOnly: true }
      responses:
        "201":
          description: 账号与会话已创建
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, token]
                properties:
                  user:
                    $ref: "#/components/schemas/AccountUser"
                  token: { type: string, writeOnly: true }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      tags: [identity]
      security: []
      summary: 登录 LongHub Cloud 账号
      operationId: loginAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                password: { type: string, minLength: 8, maxLength: 256, writeOnly: true }
      responses:
        "200":
          description: 会话已创建
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, token]
                properties:
                  user: { $ref: "#/components/schemas/AccountUser" }
                  token: { type: string, writeOnly: true }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [identity]
      summary: 注销当前 Cloud 会话
      operationId: logoutAccount
      responses:
        "200":
          description: 会话已注销（重复调用安全幂等）
